<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Contact Pang</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Please fill out the form below to get in tiuch with us.</p>
            <form action="#" method="post">
                <label for="txtName">Name:</label>
                <input type="text" id="txtName" name="txtName" required maxlength="30">
                <br>
                <label for="txtEamil">Email</label>
                <input type="email" id="txtEamil" name="txtEamil" required pattern="[A-Za-z0-9._%+-]+@psu\.ac\.th">
                <br>
                <label for="txtPhone">Phone</label>
                <input type="tel" id="txtPhone" name="txtPhone" required pattern="0[689][0-9]{8}">
                <br>
                <label for="txtMessage">Message</label> 
                <textarea id="txtMessage" name="txtMessage" required></textarea>
                <br>
                <fieldset>
                    <label>Preferred Contact Method</label>
                    <label><input type="radio" id="contactEmail" name="contactMethod" value="email" required>
                    Eamil
                </label><br>
                <label>
                    <input type="radio" name="contact_mehod" value="phonr" required>
                    Phone
                </label>
                </fieldset> <br>

                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </form>

        </section>
    </main>
    <footer>
        <p>@ 2026 Contact Page.</p>
    </footer>
    
</body>
</html>
